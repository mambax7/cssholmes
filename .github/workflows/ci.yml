name: CI

on:
  workflow_call:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml
          coverage: none
          tools: composer:v2
      - name: Install shared runner tools
        run: |
          mkdir -p "$RUNNER_TEMP/xoops_lib"
          echo "XOOPS_VENDOR_PATH=$RUNNER_TEMP/xoops_lib/vendor" >> "$GITHUB_ENV"
          composer --working-dir="$RUNNER_TEMP/xoops_lib" init --name=xoops/ci-tools --no-interaction
          composer --working-dir="$RUNNER_TEMP/xoops_lib" require --dev --no-interaction --no-progress \
            'phpunit/phpunit:^11.5' 'phpstan/phpstan:^2.0'
      - name: PHP syntax and isolated regression suite
        run: |
          git ls-files -z '*.php' | xargs -0 -n1 php -l
          php tests/run.php
      - name: Scoped static analysis
        run: php "$XOOPS_VENDOR_PATH/bin/phpstan" analyse --configuration=phpstan.neon --no-progress --memory-limit=512M
      - name: JavaScript syntax
        run: for file in assets/js/*.js tests/*.cjs; do node --check "$file"; done
      - name: Install shared browser runner
        if: matrix.php == '8.4'
        run: |
          npm install --prefix "$RUNNER_TEMP/xoops-browser" --no-save --package-lock=false playwright@1.60.0
          "$RUNNER_TEMP/xoops-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/xoops-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Browser regressions and real endpoint roundtrip
        if: matrix.php == '8.4'
        run: |
          export CHROME_PATH="$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          php tests/run.php --browser
