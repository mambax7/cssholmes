# Optional Qodana analysis; shared PHP tooling remains configured separately.
name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main, 'releases/*']

permissions: {}

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
    steps:
      - name: Explain skipped scan
        if: env.QODANA_TOKEN == ''
        run: echo "::notice::QODANA_TOKEN is not available; configure this repository's Qodana project token to enable analysis."

      - name: Checkout
        if: env.QODANA_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana scan
        if: env.QODANA_TOKEN != ''
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          upload-result: true
          post-pr-comment: false
          push-fixes: none
